# X-ray coin exhibit configuration

camera:
  index: 1           # overridden by --source
  fourcc: MJPG        # compressed stream; uncompressed YUY2 at 1080p is often ~5 fps over USB. null = driver default
  width: 1920
  height: 1080
  # Fixed image parameters (no auto modes), applied as soon as the camera opens, so
  # colours and brightness never drift. Tune live in --debug or the capture tool
  # (lowercase key lowers, shift raises), then P writes them back here.
  exposure: -8          # b/B. DirectShow: ~log2(seconds), -6 = 1/64 s
  gain: 5               # g/G
  wb_temperature: 4700  # w/W. Kelvin
  focus: -1              # f/F. Driver units; 0 is often infinity
  adjust_steps:         # change per key press
    exposure: 1
    gain: 5
    wb_temperature: 200
    focus: 5

assets:
  reference: assets/reference.png  # normal coin, palm side. Source of the match target (falls back to xray.png if missing).
  front: assets/xray.png   # modified coin, palm side. Source of the overlay.
  back: assets/back.png    # reverse side. Matched as-is, only to detect a flipped coin.
  # Made by --align: the photos rotated so the coin's stripes are vertical (one shared
  # frame, the reference template's size, coin centred).
  reference_aligned: assets/reference_aligned.png  # the match target
  xray_aligned: assets/xray_aligned.png            # the overlay
  back_aligned: assets/back_aligned.png            # mirrored left-right, as seen through the coin from the front
  template_max_dim: 800    # templates are resized so their longest side is this

capture_template:          # used by capture_template.py / main.py --capture-template
  detect_max_dim: 1920     # circle detection resolution. 1920 = full res (640 was coarse and jumpy, but faster)
  blur_sigma: 3            # Gaussian blur before detection, full-res pixels. Too low: noisy and may lock
                           # onto the inner rim bevel. Too high (~5+): the coin is often not found
  smooth_frames: 15        # the shown/saved circle is the median of this many recent detections
  smooth_reset_frac: 0.1   # a detection this far off (fraction of the radius) = coin moved, restart
  circularity: 0.85        # HoughCircles ALT param2 (0..1, higher = stricter)
  min_radius_frac: 0.05    # coin radius limits, as a fraction of frame height
  max_radius_frac: 0.5
  margin: 0.02             # extra crop around the detected rim

matching:
  frame_max_dim: 1920      # captured frame is downscaled to this for SIFT. 1920 = full res:
                           # the coin is only ~480 px, downscaling cost half the inliers
  sift_features: 0         # 0 = unlimited
  ratio_test: 0.8          # Lowe's ratio test
  ransac_threshold: 5.0    # pixels (in downscaled frame)
  min_inliers: 12          # below this the side is considered "not found"
  # Back side (flipped coin): only decides "flip it" vs. "couldn't see the coin", so it can
  # be lower. Tune on the rig with --diagnose on a back-up capture. null = min_inliers.
  min_inliers_back: 8
  back_core_only: true     # match only the back's inner core (overlay.core_radius_frac): ring text varies by year
  # Allowed template->frame scale. Once the rig is fixed, tighten this around
  # the value printed in debug (e.g. [0.9*x, 1.1*x]) to kill false positives.
  scale_range: [0.8, 1.2]  # rig measured 0.977 (debug/capture_20261109_130132.png)

# How `python main.py --align` straightens the three photos (run once, after capturing
# any of them): each is rotated so the stripes on the left of the core are vertical.
# Check the result in debug/aligned_preview.png.
xray_alignment:
  stripe_radius: [0.3, 0.68]  # the stripes are looked for between these fractions of the coin radius
                              # (left half). The core only: on the modified coin the ring's stripes
                              # sit a few degrees off the core's, and only the core is overlaid
  manual_deg:              # null = detect. Else counter-clockwise degrees, as printed by --align
    reference: null        # (for back: the rotation before mirroring)
    xray: null
    back: null

# Which part of xray_aligned.png is shown. Only the inner core by default: the silver
# ring's lettering differs between coin variants, so the visitor's real ring stays.
overlay:
  core_radius_frac: 0.69   # core radius / coin radius (measured on reference.png). null = whole coin
  feather_frac: 0.02       # soft edge width, fraction of the coin radius
  # The coin's back (back_aligned.png, mirrored as if seen through the coin) is mixed over
  # the WHOLE coin: coin = (1 - w) * (real ring + x-ray core) + w * back. 0/null = no back
  back_weight: 0.4
  back_weight_step: 0.05   # o/O in --debug lower/raise back_weight by this (0..1); P saves it

debug_dir: debug          # --diagnose output and S-key frame saves

timing:
  sweep_seconds: 1.5
  xray_hold_seconds: 20
  message_seconds: 5

display:
  window_name: X-Ray
  fullscreen: true

# X-ray look. Starts as pass-through (no colour changes).
tint:
  grayscale: true              # render the x-ray result (coin + background) in grayscale
  enabled: false
  invert: true                 # invert the whole coin (ring + core + back blend); background untouched
  color_bgr: [255, 220, 120]   # tint colour applied to the grayscale coin
  background_dim: 0.0          # 0..1, darkens everything outside the coin

sweep:
  line_color_bgr: [255, 255, 180]
  line_thickness: 4
  glow: 30                     # glow height in pixels above/below the line

text:
  instructions:
    - "Place a 10 NIS coin palm-side up"
    - "Close the lid and press the button"
  flipped:
    - "That's the back of the coin"
    - "Flip it to the front and try again"
  no_match:
    - "Couldn't see the coin"
    - "Place it in the middle and try again"
